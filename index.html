<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chat App Demo</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    height:100vh;
    display:flex;
}

.sidebar{
    width:300px;
    border-right:1px solid #ccc;
    padding:15px;
}

.chat-area{
    flex:1;
    display:flex;
    flex-direction:column;
}

.section{
    margin-bottom:20px;
}

.section h3{
    margin-bottom:10px;
}

.friend,
.conversation{
    padding:10px;
    border:1px solid #ddd;
    margin-bottom:5px;
    cursor:pointer;
    border-radius:5px;
}

.friend:hover,
.conversation:hover{
    background:#f4f4f4;
}

.messages{
    flex:1;
    overflow:auto;
    padding:20px;
}

.message{
    background:#e7f3ff;
    padding:10px;
    margin-bottom:10px;
    border-radius:5px;
    width:fit-content;
}

.footer{
    display:flex;
    padding:10px;
    border-top:1px solid #ccc;
}

.footer input{
    flex:1;
    padding:10px;
}

.footer button{
    padding:10px 20px;
}

.active{
    background:#d6ecff;
}

</style>

</head>
<body>

<div class="sidebar">

    <div class="section">
        <h3>Friends</h3>
        <div id="friends"></div>
    </div>

    <div class="section">
        <h3>Create Group</h3>

        <input
            type="text"
            id="groupName"
            placeholder="Group Name"
        >

        <button onclick="createGroup()">
            Create Group
        </button>
    </div>

    <div class="section">
        <h3>Conversations</h3>
        <div id="conversations"></div>
    </div>

</div>

<div class="chat-area">

    <div
        style="
        padding:15px;
        border-bottom:1px solid #ccc;
        "
        id="chatTitle"
    >
        Select a conversation
    </div>

    <div
        class="messages"
        id="messages"
    ></div>

    <div class="footer">

        <input
            type="text"
            id="messageInput"
            placeholder="Type message..."
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>

<script>

/********************************
 CURRENT USER
********************************/

const currentUser = {
    _id:"u1",
    username:"Seif"
};


/********************************
 FAKE USERS (JSON)
********************************/

const friends = [
    {
        _id:"u2",
        username:"John"
    },
    {
        _id:"u3",
        username:"Sarah"
    },
    {
        _id:"u4",
        username:"Mike"
    }
];


/********************************
 FAKE CONVERSATIONS
********************************/

let conversations = [];


/********************************
 FAKE MESSAGES
********************************/

let messages = {};


/********************************
 UI REFERENCES
********************************/

const friendsContainer =
document.getElementById("friends");

const conversationsContainer =
document.getElementById("conversations");

const messagesContainer =
document.getElementById("messages");

let openedConversation = null;


/********************************
 LOAD FRIENDS
********************************/

function renderFriends(){

    friendsContainer.innerHTML = "";

    friends.forEach(friend=>{

        const div =
        document.createElement("div");

        div.className = "friend";

        div.innerHTML =
        `
            ${friend.username}
            <br>
            <small>
                Start Chat
            </small>
        `;

        div.onclick =
        ()=>startChat(friend);

        friendsContainer.appendChild(div);

    });

}

renderFriends();


/********************************
 CREATE DIRECT CHAT
********************************/

function startChat(friend){

    const existing =
    conversations.find(c=>

        c.type === "direct"

        &&

        c.participants.includes(friend._id)
    );

    if(existing){

        openConversation(existing.id);

        return;
    }

    const conversation = {

        id:
        "conv_" + Date.now(),

        type:"direct",

        participants:[
            currentUser._id,
            friend._id
        ],

        name:
        friend.username
    };

    conversations.push(conversation);

    messages[conversation.id] = [];

    renderConversations();

    openConversation(conversation.id);

}


/********************************
 CREATE GROUP
********************************/

function createGroup(){

    const groupName =
    document
    .getElementById("groupName")
    .value;

    if(!groupName){

        alert("Enter group name");

        return;
    }

    const group = {

        id:
        "group_" + Date.now(),

        type:"group",

        owner:
        currentUser._id,

        participants:[
            currentUser._id,
            "u2",
            "u3"
        ],

        name:
        groupName

    };

    conversations.push(group);

    messages[group.id] = [];

    renderConversations();

}


/********************************
 RENDER CONVERSATIONS
********************************/

function renderConversations(){

    conversationsContainer.innerHTML = "";

    conversations.forEach(c=>{

        const div =
        document.createElement("div");

        div.className =
        "conversation";

        div.textContent =
        c.name;

        div.onclick =
        ()=>openConversation(c.id);

        conversationsContainer
        .appendChild(div);

    });

}


/********************************
 OPEN CONVERSATION
********************************/

function openConversation(id){

    openedConversation = id;

    const conversation =
    conversations.find(
        c=>c.id === id
    );

    document
    .getElementById("chatTitle")
    .textContent =
    conversation.name;

    renderMessages();

}


/********************************
 LOAD MESSAGES
********************************/

function renderMessages(){

    messagesContainer.innerHTML = "";

    if(!openedConversation)
        return;

    const data =
        messages[
            openedConversation
        ];

    data.forEach(msg=>{

        const div =
        document.createElement("div");

        div.className =
        "message";

        div.innerHTML =
        `
            <strong>
                ${msg.sender}
            </strong>

            <br>

            ${msg.content}
        `;

        messagesContainer
        .appendChild(div);

    });

}


/********************************
 SEND MESSAGE
********************************/

function sendMessage(){

    if(!openedConversation)
        return;

    const input =
    document.getElementById(
        "messageInput"
    );

    const text =
    input.value.trim();

    if(!text)
        return;

    messages[
        openedConversation
    ].push({

        sender:
        currentUser.username,

        content:
        text

    });

    input.value = "";

    renderMessages();

}

</script>

</body>
</html>
